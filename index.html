<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini DAW Studio - Conectividad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #1a9e96;
    --gold: #c8962a;
    --dark: #0d2a29;
  }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--dark);
    font-family: 'DM Sans', sans-serif;
  }
  #slider {
    display: flex;
    width: calc(9 * 100vw);
    height: 100vh;
    transition: transform 0.7s cubic-bezier(0.77, 0, 0.18, 1);
  }
  .slide {
    width: 100vw;
    height: 100vh;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
    user-select: none;
  }
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    z-index: 100;
    background: rgba(26,158,150,0.18);
    border: 2px solid rgba(26,158,150,0.5);
    backdrop-filter: blur(8px);
    color: #fff;
    cursor: pointer;
    width: 54px; height: 54px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    transition: background 0.2s, border-color 0.2s, transform 0.2s;
  }
  .nav-btn:hover {
    background: rgba(26,158,150,0.55);
    border-color: var(--teal);
    transform: translateY(-50%) scale(1.1);
  }
  .nav-btn:disabled {
    opacity: 0.2;
    cursor: default;
    transform: translateY(-50%) scale(1);
  }
  #prev { left: 18px; }
  #next { right: 18px; }
  #dots {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.3);
    border: 1.5px solid rgba(255,255,255,0.4);
    cursor: pointer;
    transition: background 0.25s, transform 0.25s, border-color 0.25s;
  }
  .dot.active {
    background: var(--gold);
    border-color: var(--gold);
    transform: scale(1.5);
  }
  .dot:hover:not(.active) { background: rgba(255,255,255,0.6); }
  #counter {
    position: fixed;
    top: 18px; right: 22px;
    z-index: 100;
    font-size: 13px; font-weight: 500;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.08em;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(6px);
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #logo-badge {
    position: fixed;
    top: 14px; left: 18px;
    z-index: 100;
    opacity: 0.7;
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    color: var(--teal);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    pointer-events: none;
  }
  #hint {
    position: fixed;
    bottom: 52px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.07em;
    pointer-events: none;
    transition: opacity 1s;
  }
  #progress {
    position: fixed;
    top: 0; left: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    z-index: 200;
    transition: width 0.7s cubic-bezier(0.77, 0, 0.18, 1);
    box-shadow: 0 0 8px rgba(200,150,42,0.5);
  }
</style>
</head>

<div id="dots"></div>
<script>
  const TOTAL = 9;
  let current = 0;
  const slider = document.getElementById('slider');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const dotsEl = document.getElementById('dots');
  const counter = document.getElementById('counter');
  const progress = document.getElementById('progress');
  const hint = document.getElementById('hint');
  for (let i = 0; i < TOTAL; i++) {
    const d = document.createElement('button');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.setAttribute('aria-label', 'Ir a slide ' + (i + 1));
    d.addEventListener('click', () => goTo(i));
    dotsEl.appendChild(d);
  }
  function goTo(n) {
    current = Math.max(0, Math.min(TOTAL - 1, n));
    slider.style.transform = 'translateX(-' + (current * 100) + 'vw)';
    counter.textContent = (current + 1) + ' / ' + TOTAL;
    progress.style.width = (((current + 1) / TOTAL) * 100) + '%';
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL - 1;
    dotsEl.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  }
  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') goTo(current + 1);
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goTo(current - 1);
    if (e.key === 'Home') goTo(0);
    if (e.key === 'End') goTo(TOTAL - 1);
  });
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) goTo(current + (dx < 0 ? 1 : -1));
  });
  setTimeout(() => { hint.style.opacity = '0'; }, 4000);
  goTo(0);
</script>
